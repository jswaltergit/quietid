  <style>
    .qr-sweep { transform-box: fill-box; transform-origin: center; animation: qr-spin 3.2s linear infinite; }
    .qr-blip { opacity: 0; transform-box: fill-box; transform-origin: center; animation: qr-blip 3.2s ease-out infinite; }
    .qr-ping { transform-box: fill-box; transform-origin: center; animation: qr-ping 3.2s ease-out infinite; }
    .qr-ping--2 { animation-delay: 1.60s; }
    @keyframes qr-spin { to { transform: rotate(360deg); } }
    @keyframes qr-blip { 0% { opacity: 1; transform: scale(1.5); } 12% { opacity: 1; transform: scale(1); } 70%, 100% { opacity: 0; transform: scale(1); } }
    @keyframes qr-ping { 0% { transform: scale(1); opacity: .55; } 100% { transform: scale(4.6); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .qr-sweep, .qr-blip, .qr-ping { animation: none; } .qr-blip { opacity: 1; } .qr-ping { opacity: 0; } }
  </style>
